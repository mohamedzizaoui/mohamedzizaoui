<!doctype html>
<html lang="nl-BE">
<head>
<meta charset="utf-8">
<title>Controle 3D-velgen</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #e8eaed; font: 13px system-ui; color: #333; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #uit { position: fixed; left: 8px; top: 8px; background: rgba(255,255,255,.85); padding: 6px 10px; border-radius: 6px; white-space: pre; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="uit">laden…</div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { maakStudioOmgeving } from '../demo/3d/studio.js';
import { maakWiel } from '../demo/3d/velg3d.js';
import { VELGEN } from '../demo/3d/ontwerpen.js';

const q = new URLSearchParams(location.search);
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe8eaed);
scene.environment = maakStudioOmgeving(renderer);
const zon = new THREE.DirectionalLight(0xffffff, 1.2); zon.position.set(2, 4, 5); zon.castShadow = true; scene.add(zon);
scene.add(new THREE.AmbientLight(0xffffff, 0.2));

const enkel = q.get('velg');
const hoek = +(q.get('hoek') || 0.55);
const lijst = enkel != null ? [VELGEN[+enkel]] : VELGEN;
const kol = enkel != null ? 1 : 3, stap = 0.8;
const t0 = performance.now();
lijst.forEach((v, i) => {
  const wiel = maakWiel(v.ontwerp, { inch: v.maten.includes(19) ? 19 : v.maten[v.maten.length - 1], breedteJ: v.breedte, steek: v.steek, naafgat: v.naafgat, afwerking: q.get('afw') || v.afwerking, band: { breedte: 235, profiel: 40 }, voor: true, klauwKleur: 0xc8102e });
  wiel.rotation.y = hoek;
  wiel.position.set((i % kol - (kol - 1) / 2) * stap, -(Math.floor(i / kol) - (Math.ceil(lijst.length / kol) - 1) / 2) * stap, 0);
  scene.add(wiel);
});
const camera = new THREE.PerspectiveCamera(enkel != null ? 28 : 34, innerWidth / innerHeight, 0.05, 50);
camera.position.set(0, 0, enkel != null ? 1.6 : 4.3);
const controls = new OrbitControls(camera, canvas);
let tris = 0; scene.traverse(o => { if (o.isMesh) tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; });
document.getElementById('uit').textContent = `${lijst.map(v => v.merk + ' ' + v.naam).join(' · ')}\nopbouw ${(performance.now() - t0).toFixed(0)} ms · ${Math.round(tris / 1000)}k driehoeken`;
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
window.__klaar = true;
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });
</script>
</body>
</html>
